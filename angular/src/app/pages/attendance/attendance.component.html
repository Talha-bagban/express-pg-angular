<div class="container-fluid">
    <h4>Attendance</h4>
    <p-table
    #dt
    [value]="attendanceList"
    [paginator]="true"
    [rows]="60"
    [globalFilterFields]="['firstname', 'lastname', 'email', 'department']"
    responsiveLayout="scroll"
  >
  <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Date</th>
        <th>Check In</th>
        <th>Check Out</th>
        <th>Woking Hours</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-a>
      <tr>
        <td>{{ a.firstname }} {{ a.lastname }} ({{a.role}})</td>
        <td>
          {{ a?.attendance_date | date:'dd MMM yyyy' }}
        </td>
        <td>
          {{ a?.check_in | date:'hh:mm:ss a' }}
        </td>
        <td>
          {{ a?.chech_out | date:'hh:mm:ss a' }}
        </td>
        <td>
            {{a?.hours}} H
        </td>
        <td >
          <!-- <button
            class="btn btn-warning me-2"
            type="button"
            (click)="onEdit(d)"
          >
            Edit
          </button>
          <button
            *ngIf="isAdmin"
            class="btn btn-danger"
            (click)="deleteEmployee(d.id)"
          >
            Delete
          </button> -->
        </td>
      </tr>
    </ng-template>
    
  </p-table>
</div>
